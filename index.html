<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz de Tecnologia</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="quiz-container">

        <section id="quiz">

            <h1>Quiz de Tecnologia</h1>

            <p class="subtitle">
                Teste seus conhecimentos sobre Tecnologia e Internet
            </p>

            <div class="progress">
                <div id="progressBar"></div>
            </div>

            <p id="questionNumber"></p>

            <h2 id="question"></h2>

            <div id="options"></div>

            <button id="hintButton" class="hint-button">
                💡 Mostrar dica
            </button>

            <p id="hint" class="hint"></p>

            <div id="feedback"></div>

            <button id="nextButton" class="next-button">
                Próxima pergunta
            </button>

        </section>

        <section id="result" class="result">

            <h2>Quiz finalizado!</h2>

            <p>Você acertou:</p>

            <div id="score"></div>

            <p id="message"></p>

            <button id="restartButton">
                Refazer quiz
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
